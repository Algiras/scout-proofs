apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "scout.fullname" . }}-config
  labels: {{- include "scout.labels" . | nindent 4 }}
data:
  broker-url: {{ include "scout.brokerUrl" . | quote }}
  client-id: {{ .Values.provider.clientId | quote }}
  {{- if .Values.mockProvider.enabled }}
  provider-auth-url: "http://{{ include "scout.providerHost" . }}:{{ .Values.mockProvider.frontPort }}/authorize"
  provider-token-url: "http://{{ include "scout.providerHost" . }}:{{ .Values.mockProvider.backPort }}/token"
  provider-revoke-url: "http://{{ include "scout.providerHost" . }}:{{ .Values.mockProvider.backPort }}/revoke"
  {{- else }}
  provider-auth-url: {{ required "provider.authUrl is required when mockProvider.enabled=false" .Values.provider.authUrl | quote }}
  provider-token-url: {{ required "provider.tokenUrl is required" .Values.provider.tokenUrl | quote }}
  provider-revoke-url: {{ .Values.provider.revokeUrl | quote }}
  {{- end }}
