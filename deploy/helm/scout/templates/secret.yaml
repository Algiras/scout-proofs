# SPDX-License-Identifier: Apache-2.0
{{- if not .Values.secrets.existingSecret }}
{{- $name := include "scout.secretName" . }}
{{- $old := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $cs := .Values.secrets.clientSecret }}
{{- $ck := .Values.secrets.commitKey }}
{{- if and $old (not $cs) }}{{ $cs = index $old.data "client-secret" | b64dec }}{{ end }}
{{- if and $old (not $ck) }}{{ $ck = index $old.data "commit-key" | b64dec }}{{ end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "scout.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Generated values are for the demo only; supply secrets.* or secrets.existingSecret in real use.
  client-secret: {{ default (randAlphaNum 32) $cs | quote }}
  commit-key: {{ default (randAlphaNum 32) $ck | quote }}
{{- end }}
