name: verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  z3:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y z3
      - run: python3 proofs/scout_smt.py

  lean:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.36.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - run: python3 proofs/export.py --check-lean

  tla:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: curl -sSL -o /tmp/tla2tools.jar https://github.com/tlaplus/tlaplus/releases/download/v1.8.0/tla2tools.jar
      - run: python3 proofs/export.py --check-tla /tmp/tla2tools.jar

  proverif:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libgtk2.0-dev pkg-config
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.2"
      - run: opam install -y proverif.2.05
      - run: opam exec -- python3 proofs/symbolic/gen.py
      - run: opam exec -- python3 proofs/symbolic/gen_assertion.py
      - run: opam exec -- python3 proofs/symbolic/gen_delegation.py

  rust:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: impl
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  kani:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: model-checking/kani-github-action@v1
        with:
          working-directory: impl/scout-core

  helm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/helm/scout
      - run: helm template scout deploy/helm/scout > /dev/null

  compose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f impl/docker-compose.yml up --build --abort-on-container-exit --exit-code-from runner
      - if: always()
        run: docker compose -f impl/docker-compose.yml down -v

  kind:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t scout:dev impl
      - uses: helm/kind-action@v1
        with:
          cluster_name: scout-demo
      - run: kind load docker-image scout:dev --name scout-demo
      - uses: azure/setup-helm@v4
      - name: Validate rendered objects against the API server
        run: helm template scout deploy/helm/scout | kubectl apply --dry-run=server -f -
      - run: helm install demo deploy/helm/scout --wait --timeout 3m
      - run: kubectl wait --for=condition=complete job/demo-scout-example --timeout=240s
      - run: kubectl logs job/demo-scout-example
      - run: kubectl get pods,jobs,pvc,networkpolicy
      - if: failure()
        run: |
          kubectl get pods -o wide
          kubectl describe pods
          kubectl logs -l app.kubernetes.io/instance=demo --all-containers --tail=200 || true
