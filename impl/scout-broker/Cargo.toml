[package]
name = "scout-broker"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[[bin]]
name = "scoutd"
path = "src/main.rs"

[dependencies]
scout-core = { path = "../scout-core" }
scout-wire = { path = "../scout-wire" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ed25519-dalek = "2"

[dev-dependencies]
scout-runner = { path = "../scout-runner" }
scout-mockprovider = { path = "../scout-mockprovider" }
x25519-dalek = { version = "2", features = ["static_secrets"] }
