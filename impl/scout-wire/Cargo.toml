[package]
name = "scout-wire"
version = "0.1.0"
edition = "2021"
[dependencies]
x25519-dalek = { version = "2", features = ["static_secrets"] }
ed25519-dalek = "2"
hkdf = "0.12"
sha2 = "0.10"
hmac = "0.12"
aes-gcm = "0.11"
rand_core = { version = "0.6", features = ["getrandom"] }
subtle = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
ureq = "2"
