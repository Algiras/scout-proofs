[package]
name = "scout-runner"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[[bin]]
name = "scout-run"
path = "src/main.rs"

[dependencies]
scout-wire = { path = "../scout-wire" }
serde_json = "1"
ed25519-dalek = "2"
x25519-dalek = { version = "2", features = ["static_secrets"] }
nix = { version = "0.32", default-features = false, features = ["signal", "process"] }

[[bin]]
name = "scout-whoami"
path = "src/whoami.rs"
